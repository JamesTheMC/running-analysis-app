<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'" />
    <title>Unit Tests</title>
    <style>
      :root { --bg: #fff; --fg: #1a1f24; --muted: #5b6670; --line: #d9dee3; --ok: #1a7f37; --bad: #c62828; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --bg: #0f1419; --fg: #e6e9ec; --muted: #9aa5b1; --line: #2b333b; --ok: #4ac26b; --bad: #ff6b6b; }
      }
      body { background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; max-width: 1100px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 20px 0 6px; }
      .pass { color: var(--ok); }
      .fail { color: var(--bad); font-weight: 600; }
      .skip, .muted { color: var(--muted); }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
      th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); }
      #summary { font-weight: 600; font-size: 16px; }
    </style>
  </head>
  <body>
    <h1>Unit tests</h1>
    <p class="muted">View-to-metric map enforcement and regression checks. No video is read; the regression section uses cached landmarks in test-data/debug/ when present.</p>
    <p id="summary">Running…</p>
    <div id="out"></div>
    <script src="unit-guard.js"></script>
    <script type="module" src="unit.js"></script>
  </body>
</html>
